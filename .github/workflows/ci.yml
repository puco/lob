name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Arch rather than Ubuntu: Lob needs KDE Frameworks 6.19+ and
    # layer-shell-qt, which Ubuntu's archives lag well behind.
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-svg \
            kirigami kirigami-addons ki18n kcoreaddons kconfig kdbusaddons \
            knotifications kwindowsystem kiconthemes kcolorscheme kcrash \
            kstatusnotifieritem kservice kio layer-shell-qt qqc2-desktop-style \
            appstream desktop-file-utils \
            sway

      - uses: actions/checkout@v4

      - name: Check version consistency
        run: ./packaging/check-version.sh

      - name: Check the message template is current
        # A .pot that has drifted from the sources means a translator works on
        # strings the application no longer shows, and never sees the ones it
        # does. Cheaper to catch here than to discover from a stale translation.
        run: |
          git config --global --add safe.directory "$PWD"
          ./Messages.sh
          git diff --exit-code po/lob.pot

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        # Everything here runs without a display. Kept as its own step so a
        # compositor that fails to start cannot be mistaken for a broken test.
        run: ctest --test-dir build --output-on-failure

      - name: Test under a compositor
        # The layer-shell surface, the exclusive keyboard grab and being placed
        # on an output are the parts that only exist on a compositor, and until
        # now they were checked by hand or not at all. sway runs headless with
        # two outputs, so the single-monitor case stops being the only one
        # anything is ever tried on.
        run: tests/run-under-compositor.sh --test-dir build --output-on-failure

      - name: Install
        run: DESTDIR="$PWD/staging" cmake --install build

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate staging/usr/share/applications/io.github.puco.lob.desktop
          appstreamcli validate --no-net staging/usr/share/metainfo/io.github.puco.lob.metainfo.xml

      - name: Build the release package from this revision
        run: |
          # The workspace belongs to the runner's user, not to root inside the
          # container, and git refuses to touch a repository it thinks someone
          # else owns. The release workflow marks it safe for the same reason.
          git config --global --add safe.directory "$PWD"
          version=$(sed -nE 's/^project\(lob VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          git archive --format=tar.gz --prefix="lob-$version/" -o "lob-$version.tar.gz" HEAD
          useradd -m builder
          chown -R builder .
          su builder -c "bash packaging/check-package.sh '$PWD/lob-$version.tar.gz' '$PWD/packaging/aur/lob/PKGBUILD' '$PWD/package-check'"

  fedora:
    name: Build the Fedora package
    runs-on: ubuntu-latest
    container: fedora:latest
    # Arch is the reference platform, but it is not the only one Lob claims to
    # run on any more. A spec that is never built is a spec that is wrong, and
    # finding that out from a user's dnf is worse than finding it out here.

    steps:
      - name: Install rpm tooling
        run: dnf install -y rpm-build rpmdevtools dnf-plugins-core git-core

      - uses: actions/checkout@v4

      - name: Build the RPM from this revision
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(sed -nE 's/^project\(lob VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          rpmdev-setuptree
          git archive --format=tar.gz --prefix="lob-$version/" \
              -o ~/rpmbuild/SOURCES/"lob-$version.tar.gz" HEAD
          cp packaging/fedora/lob.spec ~/rpmbuild/SPECS/
          dnf builddep -y ~/rpmbuild/SPECS/lob.spec
          rpmbuild -bb ~/rpmbuild/SPECS/lob.spec

      - name: Show what the package contains
        # %files drifting out of step with what CMake installs is the failure
        # this catches -- rpmbuild errors on unpackaged files, but a stale entry
        # that happens to still exist is only visible by reading the list.
        run: rpm -qlp ~/rpmbuild/RPMS/*/lob-*.rpm

  packaging:
    name: Validate PKGBUILDs
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib

      - uses: actions/checkout@v4

      - name: Check .SRCINFO is current
        # A stale .SRCINFO is the usual way an AUR package breaks: the AUR reads
        # it, not the PKGBUILD, so the two disagreeing ships the wrong metadata.
        run: |
          useradd -m builder && chown -R builder .
          for pkg in lob lob-git; do
            su builder -c "cd packaging/aur/$pkg && makepkg --printsrcinfo > /tmp/$pkg.SRCINFO"
            diff -u "packaging/aur/$pkg/.SRCINFO" "/tmp/$pkg.SRCINFO" \
              || { echo "::error::packaging/aur/$pkg/.SRCINFO is stale; regenerate with 'makepkg --printsrcinfo > .SRCINFO'"; exit 1; }
          done
